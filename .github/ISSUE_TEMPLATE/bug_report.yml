name: Bug 报告
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量提供可复现步骤、日志和相关配置内容；请勿粘贴 registry token、私钥或其他敏感信息。

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux
        - 其他
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: 系统版本
      description: 例如 Windows 11 23H2 / macOS 15.1
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: MirrorSwitch 版本
      description: 可在设置页底部或 Windows 文件属性中查看
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 问题区域
      options:
        - Cargo 切换
        - Rustup 切换
        - 测速对比
        - 备份恢复
        - 界面 / 主题
        - 构建 / 打包
        - 其他
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？期望发生什么？
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 看到 ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 错误信息
      description: 可粘贴设置页的操作日志；请先移除敏感信息。
      render: text

  - type: textarea
    id: config
    attributes:
      label: 相关配置（可选）
      description: 例如脱敏后的 Cargo config、Shell 托管块或备份摘要。
      render: toml

  - type: checkboxes
    id: checks
    attributes:
      label: 确认事项
      options:
        - label: 我已搜索现有 Issue，没有重复报告。
          required: true
        - label: 我已移除日志和配置中的敏感信息。
          required: true
