name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请说明要解决的问题，而不只是实现方式。功能建议不等同于承诺实现。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前使用中遇到了什么不便？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望 MirrorSwitch 如何解决它？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过哪些替代做法？

  - type: dropdown
    id: platforms
    attributes:
      label: 涉及平台
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
        - 所有平台

  - type: checkboxes
    id: checks
    attributes:
      label: 确认事项
      options:
        - label: 我已搜索现有 Issue，没有重复建议。
          required: true
