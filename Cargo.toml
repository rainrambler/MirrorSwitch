[package]
name = "mirror-switch"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
description = "A fast, safe Rust mirror switcher for rustup and cargo, built with egui"
authors = ["MirrorSwitch contributors"]
license = "MIT"
readme = "README.md"
keywords = ["rustup", "cargo", "mirror", "egui", "gui"]
categories = ["development-tools", "gui"]
default-run = "MirrorSwitch"

[[bin]]
name = "MirrorSwitch"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
png = "0.18"
dirs = "6.0"
eframe = { version = "=0.32.3", default-features = false, features = ["default_fonts", "glow"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls", "system-proxy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml_edit = "0.25"
ttf-parser = "0.25"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
